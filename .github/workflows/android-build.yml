name: Build Android APK

# 推送到 main 或手动触发时，云端自动构建 APK 并作为 Artifact 上传
on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run unit tests
        working-directory: android
        run: |
          # 纯 JVM 单元测试（二维码解析 / 授权 URL 的安全判定），无需模拟器
          gradle testDebugUnitTest --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/

      - name: Build Debug APK
        working-directory: android
        run: |
          # ubuntu-latest 自带 Gradle 8.x 与 Android SDK（已预授权许可证）
          gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniLink-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

# 使用方法：
#   1. 把 unilink/ 整个目录推到 GitHub 仓库的根目录或子目录均可
#      （若放在子目录，请把上面 working-directory/path 相应调整）
#   2. 仓库页 → Actions → Build Android APK → Run workflow
#   3. 构建完成后在该次运行页面底部 Artifacts 下载 UniLink-debug-apk.zip，
#      解压得到 app-debug.apk，传到手机安装即可
#
# 如需正式签名版：在仓库 Secrets 添加 KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
# KEY_ALIAS / KEY_PASSWORD，并扩展 release 构建（后续可帮你加）。
