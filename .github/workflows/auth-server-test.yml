name: Auth Server Tests

# auth-server 是安全边界所在，任何改动都要跑全套测试
on:
  push:
    branches: [ main, master ]
    paths:
      - 'auth-server/**'
      - '.github/workflows/auth-server-test.yml'
  pull_request:
    paths:
      - 'auth-server/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [ '3.11', '3.12' ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        working-directory: auth-server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes

      - name: Lint
        working-directory: auth-server
        run: python -m pyflakes app.py config.py store.py identity.py jwtutil.py qr.py pages.py test_flow.py

      - name: Run tests
        working-directory: auth-server
        run: python -m unittest test_flow -v
