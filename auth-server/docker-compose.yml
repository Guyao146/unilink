# UniLink 扫码登录服务
#
# 用法:
#   1. cp .env.example .env  并填写（至少要改 UNILINK_CLIENT_SECRET）
#   2. docker compose up -d
#   3. docker compose logs -f
#
# 服务只绑在 127.0.0.1:8790，必须经由宿主机的 nginx/Caddy 反代出去 ——
# 直接暴露到公网会让授权码与 authentik 令牌以明文传输。

services:
  auth-server:
    build: .
    image: unilink-auth:latest
    container_name: unilink-auth
    restart: unless-stopped

    # 只监听环回地址，杜绝绕过反代直连
    ports:
      - "127.0.0.1:${UNILINK_PORT:-8790}:${UNILINK_PORT:-8790}"

    # 所有配置都在同目录的 .env 里改；全部留空时服务会自动进入「首次配置模式」：
    # 打开反代后的 https 地址 /setup，用日志里的令牌在网页上完成配置。
    # 这一份 environment 的作用是给可选项提供默认值，并让 .env 的写法生效。
    env_file: .env

    environment:
      # ── 必填（留空 → 进入首次配置模式，不阻塞启动）──
      UNILINK_BASE_URL: ${UNILINK_BASE_URL:-}
      UNILINK_AUTHENTIK_URL: ${UNILINK_AUTHENTIK_URL:-}
      UNILINK_CLIENT_SECRET: ${UNILINK_CLIENT_SECRET:-}

      # ── 可选（留空即用默认值）──
      UNILINK_CLIENT_ID: ${UNILINK_CLIENT_ID:-unilink-qr}
      UNILINK_APP_CLIENT_ID: ${UNILINK_APP_CLIENT_ID:-unilink-mobile}
      UNILINK_APP_REDIRECT_URI: ${UNILINK_APP_REDIRECT_URI:-unilink://auth/callback}
      UNILINK_APP_SCOPES: ${UNILINK_APP_SCOPES:-openid profile email offline_access}
      UNILINK_LOGIN_TTL: ${UNILINK_LOGIN_TTL:-180}
      UNILINK_CODE_TTL: ${UNILINK_CODE_TTL:-60}
      UNILINK_TOKEN_TTL: ${UNILINK_TOKEN_TTL:-300}
      UNILINK_MAX_SESSIONS: ${UNILINK_MAX_SESSIONS:-500}
      # 白名单：逗号或空白分隔多个 sub / group，留空表示不限制
      UNILINK_ALLOWED_SUBS: ${UNILINK_ALLOWED_SUBS:-}
      UNILINK_ALLOWED_GROUPS: ${UNILINK_ALLOWED_GROUPS:-}

      # 客户端（authentik 里的 OAuth Source）由 client_id / client_secret /
      # authentik_url 自动拼装，无需手写 JSON。
      # 若要完全自定义（多个客户端等），设 UNILINK_CLIENTS 为 JSON 数组即可覆盖。

    volumes:
      # RSA 签名私钥必须持久化：丢了等于换发卡机构，
      # authentik 缓存的公钥会验签失败
      - ./keys:/app/keys
      # 网页后台写入的配置（首次向导 / 管理面板）
      - ./data:/app/data

    # authentik 若也在 docker 里，加入同一网络可走容器名直连，
    # 免去出公网绕一圈。按需取消注释并改成你的网络名。
    # networks:
    #   - authentik_default

# networks:
#   authentik_default:
#     external: true
